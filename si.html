<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Plan Cerrado! 🍜🚶‍♀️✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #fff7ed, #ffedd5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Emojis sutiles flotando en el fondo */
    .fondo-flotante span {
      position: absolute;
      user-select: none;
      font-size: 2rem;
      opacity: 0.25;
      animation: flotarFondo 10s infinite linear;
    }

    @keyframes flotarFondo {
      0% { transform: translateY(105vh) rotate(0deg); }
      100% { transform: translateY(-10vh) rotate(360deg); }
    }

    .card {
      background: #ffffff;
      padding: 35px 28px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(234, 88, 12, 0.15);
      max-width: 450px;
      width: 100%;
      text-align: center;
      border: 2px solid #fed7aa;
      position: relative;
      z-index: 10;
      animation: aparecer 0.6s ease forwards;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .badge {
      display: inline-block;
      background: #ffedd5;
      color: #c2410c;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      border: 1px solid #fdba74;
    }

    /* Contenedor y estilos para la foto del Ajinomen */
    .contenedor-ajinomen {
      margin: 8px auto 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .img-ajinomen {
      max-width: 180px;
      width: 100%;
      height: auto;
      border-radius: 16px;
      filter: drop-shadow(0 10px 15px rgba(234, 88, 12, 0.25));
      animation: flotarAjinomen 2.5s infinite ease-in-out;
    }

    @keyframes flotarAjinomen {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    h1 {
      color: #9a3412;
      font-size: 1.6rem;
      margin-bottom: 14px;
      font-weight: 800;
      line-height: 1.3;
    }

    p {
      color: #7c2d12;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn-wsp {
      padding: 14px 24px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #25d366;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
      width: 100%;
    }

    .btn-wsp:hover {
      background: #1eb856;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <!-- Fondo animado sutil -->
  <div class="fondo-flotante">
    <span style="left: 12%; animation-duration: 9s;">🎉</span>
    <span style="left: 28%; animation-duration: 12s; animation-delay: 1s;">✨</span>
    <span style="left: 50%; animation-duration: 8s; animation-delay: 2s;">🚶‍♀️</span>
    <span style="left: 72%; animation-duration: 11s;">💬</span>
    <span style="left: 88%; animation-duration: 10s; animation-delay: 3s;">🛵</span>
  </div>

  <div class="card">
    <div class="badge">Domingo Rescatado con Éxito 🎉🍜</div>
    
    <!-- Imagen del Ajinomen real -->
    <div class="contenedor-ajinomen">
      <img src="ajinomen.png" alt="Ajinomen delicioso" class="img-ajinomen" />
    </div>

    <h1>¡Excelente decisión! 😎</h1>
    
    <p>
      Declaramos oficialmente cancelado el aburrimiento.
      <br><br>
      Los fideos quedan prometidos aparte que te los debo. Toca coordinar la hora me avisas..😜
    </p>

    <!-- Recuerda cambiar 51987654321 por tu número con código de país -->
    <a href="https://wa.me/51987654321?text=¡Trato%20hecho!%20🍜%20Acepto%20el%20plan%20de%20Ajinomen%20para%20salvar%20el%20domingo,%20¿a%20qué%20hora%20le%20damos?" 
       class="btn-wsp" target="_blank">
      Coordinar la hora por WhatsApp 📲
    </a>
  </div>

</body>
</html>
